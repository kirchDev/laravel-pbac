# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A Packagist package: the tag is what Composer resolves, so nothing is
# published from here.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
