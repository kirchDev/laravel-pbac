# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Two bodies: the Node gate from package.json's `check`, and the PHP suite the
# package actually ships. The support matrix is the one thing neither body can
# read from the repo, so it is the only input.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

# PERMISSIONS PER JOB, NOT PER WORKFLOW. A workflow-level block caps every
# called body: `_ci-laravel.yml` needs `pull-requests: write` for its coverage
# comment, and a caller holding only `contents: read` makes the whole run fail
# at startup rather than at that step.
jobs:
  check:
    name: CI
    permissions:
      contents: read
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2

  php:
    name: PHP
    permissions:
      contents: read
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_ci-laravel.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2
    with:
      php-versions: '["8.4", "8.5"]'
      laravel-versions: '["13.*"]'
      postgres-database: pbac_test
