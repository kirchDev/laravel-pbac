name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.json'
      - '**/*.jsonc'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - 'composer.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'phpstan.neon'
      - 'phpunit.xml.dist'
      - 'pint.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    # ready_for_review is required so the dev→main rollup PR (opened as a draft
    # by GITHUB_TOKEN, which triggers no workflows) runs CI once a human marks
    # it ready — otherwise main's required status checks deadlock the rollup.
    types: [opened, synchronize, reopened, ready_for_review]
    # Deliberately NO paths filter here (unlike the push trigger above): main's
    # required status checks ARE this workflow's jobs, so a PR the filter misses
    # runs no CI at all — its contexts then stay pending forever and the merge is
    # blocked with nothing that can clear it. The old filter was extension-based,
    # so `LICENSE`, `.gitignore`, `.nvmrc` and the `.husky/` hooks fell straight
    # through it. It saved almost nothing either: it already matched `**/*.md`,
    # `**/*.json`, `**/*.yml` and every source directory.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_AUDIT: 1
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  node-check:
    name: Node check (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run check (lint + format)
        run: pnpm check

  test:
    name: Pest (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13.*']
        dependencies: [highest, lowest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependencies }}-
      - name: Pin Laravel version
        run: |
          composer require \
            "illuminate/auth:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/events:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            --no-update --no-interaction
      - name: Install Composer dependencies
        run: |
          composer update --prefer-dist --no-progress \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Run Pest
        run: composer test

  test-pgsql:
    name: Pest (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbac_test
          POSTGRES_USER: pbac
          POSTGRES_PASSWORD: pbac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pbac_test
      DB_USERNAME: pbac
      DB_PASSWORD: pbac

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-pgsql-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-pgsql-
      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run Pest
        run: composer test

  coverage:
    name: Coverage (PCOV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, pcov
          coverage: pcov
          ini-values: pcov.directory=src
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-coverage-
      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run Pest with coverage
        # `--min=90` is the coverage gate (fails the run below 90%) — kept local.
        # Cobertura format (not clover) so CodeCoverageSummary can parse it.
        run: vendor/bin/pest --coverage --coverage-cobertura=coverage.xml --min=90

      # Post/update a sticky PR comment with the clover summary — no external
      # service (replaces the Codecov upload). Gate stays `--min=90` above.
      - name: Coverage summary (markdown)
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: file
      - name: Sticky PR coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: code-coverage-results.md

  lint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-pint-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-pint-
      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run Pint
        run: composer pint

  static-analysis:
    name: Larastan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-larastan-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-larastan-
      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-progress
      - name: Run Larastan
        run: composer larastan
