# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Two bodies: the Node gate from package.json's `check`, and the PHP suite the
# package actually ships. The support matrix is the one thing neither body can
# read from the repo, so it is the only input.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@f47f598f549a3c97924fdfd00f15371ea557e1aa # v0.1.1

  php:
    name: PHP
    uses: kirchDev/workflows/.github/workflows/_ci-laravel.yml@f47f598f549a3c97924fdfd00f15371ea557e1aa # v0.1.1
    with:
      php-versions: '["8.4", "8.5"]'
      laravel-versions: '["13.*"]'
      postgres-database: pbac_test
